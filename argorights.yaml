apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: argocd-helm-lookup-config-reader
rules:
- apiGroups:
  - config.openshift.io
  resources:
  - ingresses
  - dnses
  - infrastructures
  verbs:
  - get
  - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: argocd-helm-lookup-config-reader-binding
subjects:
- kind: ServiceAccount
  name: default 
  namespace: openshift-gitops
roleRef:
  kind: ClusterRole
  name: argocd-helm-lookup-config-reader
  apiGroup: rbac.authorization.k8s.io
