# Default values for bootstrap chart
# This chart creates the bootstrap Application (app-of-apps parent)

bootstrap:
  # Git repository URL
  repoURL: https://github.com/dieterdm/agentops-in-prod-automation
  # Branch or tag to use
  targetRevision: opencode

logging:
  # Storage class used by the LokiStack PVCs
  storageClassName: kubevirt-csi-infra-default

users:
  # Users granted cluster-admin, OpenShift AI admin and ArgoCD admin rights.
  # These users must already exist on the cluster.
  clusterAdmins:
    - dieter

maas_external_provider:
  enabled: true

ogx:
  # Deploy the OGX server with pgvector and the e5 embedding model. Needs the
  # rag settings in values.secret.yaml.
  enabled: true

evalhub:
  # Deploy TrustyAI EvalHub with a PostgreSQL database for evaluating models.
  # Needs the trustyai component of the DataScienceCluster.
  enabled: true

openshiftai:
  # Subscription channel for the RHOAI operator
  channel: beta
  clusterDomain: apps.rhoai2.apps.ocp4-bm.redhat.arrowlabs.be
  cert: default-ingress-cert
