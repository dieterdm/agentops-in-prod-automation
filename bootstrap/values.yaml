# Default values for bootstrap chart
# This chart creates the bootstrap Application (app-of-apps parent)

bootstrap:
  # Git repository URL
  repoURL: https://github.com/dieterdm/agentops-in-prod-automation
  # Branch or tag to use
  targetRevision: opencode

maas_external_provider:
  enabled: true

openshiftai:
  clusterDomain: apps.rhoai.apps.ocp4-bm.redhat.arrowlabs.be
  cert: default-ingress-cert
