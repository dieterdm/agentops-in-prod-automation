---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: logging
  namespace: openshift-gitops
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    name: in-cluster
    namespace: openshift-logging
  project: default
  source:
    path: deployments/logging
    repoURL: {{ .Values.bootstrap.repoURL }}
    targetRevision: {{ .Values.bootstrap.targetRevision }}
    helm:
      valuesObject:
        s3:
          access_key_id: "{{ .Values.logging_s3_bucket.access_key_id }}"
          access_key_secret: "{{ .Values.logging_s3_bucket.access_key_secret }}"
          bucketnames: "{{ .Values.logging_s3_bucket.bucketnames }}"
          endpoint: "{{ .Values.logging_s3_bucket.endpoint }}"
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
    managedNamespaceMetadata:
      labels:
        argocd.argoproj.io/managed-by: openshift-gitops
