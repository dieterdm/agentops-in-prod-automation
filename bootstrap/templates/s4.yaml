apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: s4
  namespace: openshift-gitops
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    name: in-cluster
    namespace: s4
  project: default
  source:
    path: deployments/s4
    repoURL: {{ .Values.bootstrap.repoURL }}
    targetRevision: {{ .Values.bootstrap.targetRevision }}
    helm:
      valuesObject:
        region: "{{ .Values.s4.region }}"
        storage:
          size: "{{ .Values.s4.storageSize }}"
          storageClassName: "{{ .Values.s4.storageClassName }}"
        # Buckets served by S4. The auto bucket is in SeaweedFS.
        buckets:
          - "{{ .Values.logging.bucket }}"
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
