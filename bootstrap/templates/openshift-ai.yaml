---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openshift-ai
  namespace: openshift-gitops
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    name: in-cluster
    namespace: redhat-ods-operator
  project: default
  source:
    path: deployments/openshift-ai
    repoURL: {{ .Values.bootstrap.repoURL }}
    targetRevision: {{ .Values.bootstrap.targetRevision }}
    helm:
      valuesObject:
        clusterDomain: "{{ .Values.openshiftai.clusterDomain }}"
        cert: "{{ .Values.openshiftai.cert }}"
        maas_external_provider:
          enabled: {{ .Values.maas_external_provider.enabled }}
          {{- if .Values.maas_external_provider.enabled }}
          api_key: "{{ .Values.maas_external_provider.api_key }}"
          endpoint: "{{ .Values.maas_external_provider.endpoint }}"
          {{- end }}
  ignoreDifferences:
    - group: datasciencecluster.opendatahub.io
      kind: DataScienceCluster
      jsonPointers:
        - /spec/components
    - group: stackgres.io
      kind: SGCluster
      jsonPointers:
        - /spec/managedSql/scripts
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - RespectIgnoreDifferences=true