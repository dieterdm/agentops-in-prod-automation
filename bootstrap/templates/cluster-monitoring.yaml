---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cluster-monitoring
  namespace: openshift-gitops
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    name: in-cluster
    namespace: default
  project: default
  source:
    path: deployments/cluster-monitoring
    repoURL: {{ .Values.bootstrap.repoURL }}
    targetRevision: {{ .Values.bootstrap.targetRevision }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # The UIPlugin CRD only exists once the Cluster Observability Operator
    # this app installs is up, so keep retrying until then.
    retry:
      limit: 30
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
