{{- if .Values.auto.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: auto
  namespace: openshift-gitops
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    name: in-cluster
    namespace: auto
  project: default
  source:
    path: deployments/auto
    repoURL: {{ .Values.bootstrap.repoURL }}
    targetRevision: {{ .Values.bootstrap.targetRevision }}
    helm:
      valuesObject:
        dspa:
          objectStorage:
            endpoint: "{{ .Values.seaweedfs.endpoint }}"
            bucket: "{{ .Values.auto.bucket }}"
            region: "{{ .Values.seaweedfs.region }}"
            # Connection secret created by the bootstrap chart
            credentialsSecret: "{{ .Values.auto.bucket }}"
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # The DataSciencePipelinesApplication CRD is registered by the RHOAI
    # operator's aipipelines component, so keep retrying until the openshift-ai
    # DataScienceCluster has rolled it out.
    retry:
      limit: 30
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
{{- end }}
