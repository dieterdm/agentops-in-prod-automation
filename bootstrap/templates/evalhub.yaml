{{- if .Values.evalhub.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: evalhub
  namespace: openshift-gitops
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    name: in-cluster
    namespace: evalhub
  project: default
  source:
    path: deployments/evalhub
    repoURL: {{ .Values.bootstrap.repoURL }}
    targetRevision: {{ .Values.bootstrap.targetRevision }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    managedNamespaceMetadata:
      labels:
        argocd.argoproj.io/managed-by: openshift-gitops
    # The EvalHub CRD is registered by the RHOAI operator's TrustyAI component,
    # so keep retrying until the openshift-ai DataScienceCluster has rolled it out.
    retry:
      limit: 30
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
{{- end }}
