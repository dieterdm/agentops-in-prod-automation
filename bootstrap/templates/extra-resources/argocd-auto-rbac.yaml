{{- if .Values.auto.enabled }}
# The opendatahub.io/dashboard label makes the namespace show up as a data
# science project in the OpenShift AI dashboard.
apiVersion: v1
kind: Namespace
metadata:
  name: auto
  labels:
    opendatahub.io/dashboard: 'true'
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argocd-admin
  namespace: auto
subjects:
- kind: ServiceAccount
  name: openshift-gitops-argocd-application-controller
  namespace: openshift-gitops
roleRef:
  kind: ClusterRole
  name: admin
  apiGroup: rbac.authorization.k8s.io
---
# The built-in admin role doesn't include pipeline servers
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: argocd-dspa-manager
rules:
- apiGroups:
  - datasciencepipelinesapplications.opendatahub.io
  resources:
  - datasciencepipelinesapplications
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argocd-dspa-manager
  namespace: auto
subjects:
- kind: ServiceAccount
  name: openshift-gitops-argocd-application-controller
  namespace: openshift-gitops
roleRef:
  kind: ClusterRole
  name: argocd-dspa-manager
  apiGroup: rbac.authorization.k8s.io
---
# S3 connection to the auto bucket in SeaweedFS. The dashboard shows it as a
# connection in the auto project (used by AutoML and AutoRAG), and the pipeline
# server uses it for its artifacts. Created by the bootstrap chart rather than
# the auto Argo CD app, so the SeaweedFS credentials from values.secret.yaml
# never end up in git or in an Application.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.auto.bucket }}
  namespace: auto
  labels:
    opendatahub.io/dashboard: 'true'
    opendatahub.io/managed: 'true'
  annotations:
    opendatahub.io/connection-type: s3
    opendatahub.io/connection-type-protocol: s3
    opendatahub.io/connection-type-ref: s3
    openshift.io/display-name: {{ .Values.auto.bucket }}
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: {{ required "seaweedfs.access_key_id is required in values.secret.yaml" .Values.seaweedfs.access_key_id | quote }}
  AWS_SECRET_ACCESS_KEY: {{ required "seaweedfs.access_key_secret is required in values.secret.yaml" .Values.seaweedfs.access_key_secret | quote }}
  AWS_S3_ENDPOINT: {{ .Values.seaweedfs.endpoint | quote }}
  AWS_S3_BUCKET: {{ .Values.auto.bucket | quote }}
  AWS_DEFAULT_REGION: {{ .Values.seaweedfs.region | quote }}
{{- end }}
