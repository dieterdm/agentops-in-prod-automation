{{- if .Values.auto.enabled }}
# The opendatahub.io/dashboard label makes the namespace show up as a data
# science project in the OpenShift AI dashboard.
apiVersion: v1
kind: Namespace
metadata:
  name: auto
  labels:
    opendatahub.io/dashboard: 'true'
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argocd-admin
  namespace: auto
subjects:
- kind: ServiceAccount
  name: openshift-gitops-argocd-application-controller
  namespace: openshift-gitops
roleRef:
  kind: ClusterRole
  name: admin
  apiGroup: rbac.authorization.k8s.io
---
# The built-in admin role doesn't include pipeline servers
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: argocd-dspa-manager
rules:
- apiGroups:
  - datasciencepipelinesapplications.opendatahub.io
  resources:
  - datasciencepipelinesapplications
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argocd-dspa-manager
  namespace: auto
subjects:
- kind: ServiceAccount
  name: openshift-gitops-argocd-application-controller
  namespace: openshift-gitops
roleRef:
  kind: ClusterRole
  name: argocd-dspa-manager
  apiGroup: rbac.authorization.k8s.io
---
# Created by the bootstrap chart rather than the auto Argo CD app, so the S4
# credentials from values.secret.yaml never end up in git or in an Application.
apiVersion: v1
kind: Secret
metadata:
  name: dspa-s3-credentials
  namespace: auto
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: {{ required "s4.access_key_id is required in values.secret.yaml" .Values.s4.access_key_id | quote }}
  AWS_SECRET_ACCESS_KEY: {{ required "s4.access_key_secret is required in values.secret.yaml" .Values.s4.access_key_secret | quote }}
{{- end }}
