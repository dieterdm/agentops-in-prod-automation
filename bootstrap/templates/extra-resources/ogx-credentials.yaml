# Created by the bootstrap chart rather than the ogx Argo CD app, so the LLM
# credentials and embedding settings from values.secret.yaml never end up in
# git or in an Application. The embedding API token is generated in the
# cluster instead (ogx-embedding-client-token in the ogx chart).
apiVersion: v1
kind: Secret
metadata:
  name: ogx-secret
  namespace: ogx
type: Opaque
stringData:
  VLLM_URL: {{ .Values.rag.llm_endpoint | quote }}
  INFERENCE_MODEL: {{ .Values.rag.llm_model | quote }}
  VLLM_API_TOKEN: {{ .Values.rag.llm_api_key | quote }}
  VLLM_EMBEDDING_URL: {{ .Values.rag.embedding_endpoint | quote }}
  EMBEDDING_MODEL: {{ .Values.rag.embedding_model | quote }}
  EMBEDDING_PROVIDER_MODEL_ID: {{ .Values.rag.embedding_model | quote }}
