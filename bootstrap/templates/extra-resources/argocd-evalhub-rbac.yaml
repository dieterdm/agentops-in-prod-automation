{{- if .Values.evalhub.enabled }}
apiVersion: v1
kind: Namespace
metadata:
  name: evalhub
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argocd-admin
  namespace: evalhub
subjects:
- kind: ServiceAccount
  name: openshift-gitops-argocd-application-controller
  namespace: openshift-gitops
roleRef:
  kind: ClusterRole
  name: admin
  apiGroup: rbac.authorization.k8s.io
---
# The built-in admin role doesn't include EvalHub resources
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: argocd-evalhub-manager
rules:
- apiGroups:
  - trustyai.opendatahub.io
  resources:
  - evalhubs
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argocd-evalhub-manager
  namespace: evalhub
subjects:
- kind: ServiceAccount
  name: openshift-gitops-argocd-application-controller
  namespace: openshift-gitops
roleRef:
  kind: ClusterRole
  name: argocd-evalhub-manager
  apiGroup: rbac.authorization.k8s.io
{{- end }}
