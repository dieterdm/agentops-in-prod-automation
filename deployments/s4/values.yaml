image: quay.io/rh-aiservices-bu/s4:0.4.1
region: us-east-1

# Secret with AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, UI_USERNAME and
# UI_PASSWORD, created by the bootstrap chart from values.secret.yaml
credentialsSecret: s4-credentials

storage:
  size: 50Gi
  # Empty uses the cluster's default storage class
  storageClassName: ""

# Buckets created after S4 is up. Set by the bootstrap chart.
buckets: []

# Image with the AWS CLI, used to create the buckets
awsCliImage: public.ecr.aws/aws-cli/aws-cli:latest
