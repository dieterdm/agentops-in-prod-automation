# The OpenShift AI operator restricts egress of the AutoML and AutoRAG dashboard
# pods to ports 80, 443, 8443 and 9000 (the *-allow-ports policies). S4 serves
# the S3 API on 7480, so without this policy uploading files to an S4 connection
# in the dashboard fails with "Unable to connect to the S3 storage endpoint".
# Network policies are additive, so this only adds the S4 port.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-to-s4
  namespace: redhat-ods-applications
spec:
  podSelector:
    matchExpressions:
      - key: deployment
        operator: In
        values:
          - automl-ui
          - autorag-ui
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace }}
          podSelector:
            matchLabels:
              app: s4
      ports:
        - port: 7480
          protocol: TCP
