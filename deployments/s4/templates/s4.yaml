apiVersion: v1
kind: ConfigMap
metadata:
  name: s4-config
data:
  AWS_S3_ENDPOINT: http://localhost:7480
  AWS_DEFAULT_REGION: {{ .Values.region | quote }}
  MAX_CONCURRENT_TRANSFERS: "2"
  MAX_FILE_SIZE_GB: "20"
  PORT: "5000"
  IP: 0.0.0.0
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: s4-data
spec:
  accessModes:
    - ReadWriteOnce
  {{- with .Values.storage.storageClassName }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.storage.size }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: s4
  labels:
    app: s4
spec:
  # Only one replica is supported (SQLite backend)
  replicas: 1
  selector:
    matchLabels:
      app: s4
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: s4
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: s4
          image: {{ .Values.image }}
          ports:
            - name: s3-api
              containerPort: 7480
              protocol: TCP
            - name: web-ui
              containerPort: 5000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: s4-config
            - secretRef:
                name: {{ .Values.credentialsSecret }}
          volumeMounts:
            - name: s4-data
              mountPath: /var/lib/ceph/radosgw
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /api
              port: web-ui
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /api
              port: web-ui
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: s4-data
          persistentVolumeClaim:
            claimName: s4-data
---
# S3 API on port 7480 (in-cluster only), web UI on port 5000
apiVersion: v1
kind: Service
metadata:
  name: s4
  labels:
    app: s4
spec:
  type: ClusterIP
  selector:
    app: s4
  ports:
    - name: s3-api
      port: 7480
      targetPort: s3-api
      protocol: TCP
    - name: web-ui
      port: 5000
      targetPort: web-ui
      protocol: TCP
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: s4
  labels:
    app: s4
spec:
  port:
    targetPort: web-ui
  to:
    kind: Service
    name: s4
    weight: 100
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
