{{- $ingressConfig := lookup "config.openshift.io/v1" "Ingress" "" "cluster" -}}
{{- if not $ingressConfig }}
  {{- fail "Unable to find OpenShift cluster Ingress configuration" -}}
{{- end }}

{{- $clusterDomain := $ingressConfig.spec.domain -}}

{{- $ingressController := lookup "operator.openshift.io/v1" "IngressController" "openshift-ingress-operator" "default" -}}
{{- if not $ingressController }}
  {{- fail "Unable to find OpenShift default IngressController" -}}
{{- end }}

{{- $certificateName := "" -}}
{{- if $ingressController.spec.defaultCertificate -}}
  {{- $certificateName = $ingressController.spec.defaultCertificate.name -}}
{{- end }}

{{- if not $certificateName -}}
  {{- fail "OpenShift default IngressController has no defaultCertificate configured" -}}
{{- end }}

apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: maas-default-gateway
  namespace: openshift-ingress
  annotations:
    opendatahub.io/managed: "false"
    security.opendatahub.io/authorino-tls-bootstrap: "true"
spec:
  gatewayClassName: data-science-gateway-class

  listeners:
    - name: http
      hostname: maas.{{ $clusterDomain }}
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: All

    - name: https
      hostname: maas.{{ $clusterDomain }}
      port: 443
      protocol: HTTPS
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: {{ $certificateName }}