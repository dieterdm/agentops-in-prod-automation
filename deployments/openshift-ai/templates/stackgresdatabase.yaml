apiVersion: stackgres.io/v1
kind: SGScript
metadata:
  name: create-maas-db-script
  namespace: redhat-ods-applications
spec:
  database: postgres
  scripts:
    - name: create-maas-db
      database: postgres
      script: |
        CREATE DATABASE maas;
        GRANT ALL PRIVILEGES ON DATABASE maas TO maas_user;
---
apiVersion: stackgres.io/v1
kind: SGCluster
metadata:
  name: simple-db
  namespace: redhat-ods-applications
spec:
  instances: 1
  postgres:
    version: '15'
  userSecrets:
    - maas-db-user-secret
  pods:
    persistentVolume:
      size: '10Gi'
  managedSql:
    scripts:
      - sgScript: create-maas-db-script
---
apiVersion: v1
kind: Secret
metadata:
  name: maas-db-user-secret
  namespace: redhat-ods-applications
type: Opaque
stringData:
  username: maas_user
  password: MySuperSecretPassword123!