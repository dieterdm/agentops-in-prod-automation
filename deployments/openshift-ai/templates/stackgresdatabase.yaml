apiVersion: stackgres.io/v1
kind: SGScript
metadata:
  name: create-maas-db-script
  namespace: redhat-ods-applications
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  scripts:
    - name: create-maas-db
      script: |
        CREATE DATABASE maas;
        CREATE USER "maas_user" WITH PASSWORD 'MySuperSecretPassword123!';
        GRANT ALL PRIVILEGES ON DATABASE maas TO maas_user;
        ALTER DATABASE maas OWNER TO maas_user;
---
apiVersion: stackgres.io/v1
kind: SGCluster
metadata:
  name: simple-db
  namespace: redhat-ods-applications
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  instances: 1
  postgres:
    version: '15'
  pods:
    persistentVolume:
      size: '10Gi'
  managedSql:
    scripts:
      - sgScript: create-maas-db-script
