# Connection string for EvalHub, in the format the TrustyAI operator expects:
# a `db-url` key with a PostgreSQL URI.
apiVersion: v1
kind: Secret
metadata:
  name: evalhub-db-credentials
  namespace: evalhub
type: Opaque
stringData:
  db-url: "postgres://{{ .Values.postgresql.user }}:{{ .Values.postgresql.password }}@postgresql.evalhub.svc.cluster.local:5432/{{ .Values.postgresql.database }}"
