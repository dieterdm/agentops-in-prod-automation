# PostgreSQL database that stores EvalHub's evaluation jobs and results
postgresql:
  image: registry.redhat.io/rhel9/postgresql-16:latest
  storage: 1Gi
  database: evalhub
  user: evalhub
  # Demo credentials, replace for anything beyond a demo environment
  password: evalhub-password

evalhub:
  replicas: 1
  # single: EvalHub serves only its own namespace, so evaluations run in
  # evalhub. multi: it serves other namespaces labelled with
  # evalhub.trustyai.opendatahub.io/tenant, but then the evalhub namespace
  # itself must not carry that label.
  tenancy: single
  # Evaluation providers and benchmark collections loaded at startup
  providers:
    - lm-evaluation-harness
    - garak
    - guidellm
  collections:
    - safety-and-fairness-v1
  # MLflow tracking server for evaluation results: the one deployed by
  # OpenShift AI, served over HTTPS under /mlflow. Leave empty to disable the
  # MLflow integration.
  mlflowTrackingUri: https://mlflow.redhat-ods-applications.svc.cluster.local:8443/mlflow
