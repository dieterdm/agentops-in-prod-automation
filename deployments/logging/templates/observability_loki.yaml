apiVersion: v1
kind: Secret
metadata:
  name: loki-s3-secret
  namespace: redhat-ods-monitoring
stringData:
  access_key_id: {{ .Values.s3.access_key_id | quote }}
  access_key_secret: {{ .Values.s3.access_key_secret | quote }}
  bucketnames: {{ .Values.s3.bucketnames | quote }}
  endpoint: {{ .Values.s3.endpoint | quote }}
  region: {{ .Values.s3.region | quote }}
  # S4 serves buckets by path, not by virtual host
  forcepathstyle: "true"
type: Opaque
---
apiVersion: loki.grafana.com/v1
kind: LokiStack
metadata:
  name: usage
  namespace: redhat-ods-monitoring
  annotations:
    # After wait-for-s3-bucket (wave 1)
    argocd.argoproj.io/sync-wave: "2"
spec:
  limits:
    global:
      otlp:
        streamLabels:
          resourceAttributes:
            - name: service.name
            - name: subscription
            - name: model
            - name: response_type
            - name: kubernetes_namespace_name
  managementState: Managed
  size: 1x.demo
  storage:
    schemas:
      - effectiveDate: "2024-10-01"
        version: v13
    secret:
      credentialMode: static
      name: loki-s3-secret
      type: s3
  storageClassName: {{ .Values.storageClassName }}
  tenants:
    mode: openshift-logging
