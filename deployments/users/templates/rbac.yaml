apiVersion: user.openshift.io/v1
kind: Group
metadata:
  name: rhods-admins
users:
- dieter
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dieter-cluster-admin
subjects:
- apiGroup: rbac.authorization.k8s.io
  kind: User
  name: dieter
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-rbac-cm
  namespace: openshift-gitops
data:
  policy.csv: |
    g, dieter, role:admin
    g, system:cluster-admins, role:admin
    g, cluster-admins, role:admin
