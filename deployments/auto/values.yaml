# Pipeline server for the AutoML and AutoRAG pipelines in the auto namespace
dspa:
  name: dspa
  # SeaweedFS bucket for pipeline artifacts. The credentials are in the connection
  # secret named after the bucket, created by the bootstrap chart.
  objectStorage:
    # Full URL, for example http://seaweedfs.seaweedfs.svc.cluster.local:8333
    endpoint: needupdate
    bucket: needupdate
    region: us-east-1
    credentialsSecret: needupdate

# Image with the AWS CLI, used to wait for the S3 bucket
awsCliImage: public.ecr.aws/aws-cli/aws-cli:latest
