# Blocks the sync until the S3 bucket exists in SeaweedFS, so the DataSciencePipelinesApplication (a later
# sync wave) only starts once SeaweedFS is up and the seaweedfs app has created the
# bucket.
# A Sync hook, so it is recreated (and waits again) on every sync.
apiVersion: batch/v1
kind: Job
metadata:
  name: wait-for-s3-bucket
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "0"
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: wait
          image: {{ .Values.awsCliImage }}
          command:
            - /bin/bash
            - -c
            - |
              until aws --endpoint-url "$ENDPOINT" s3api head-bucket --bucket "$BUCKET"; do
                echo "Waiting for bucket $BUCKET at $ENDPOINT"
                sleep 10
              done
          env:
            - name: HOME
              value: /tmp
            - name: ENDPOINT
              value: {{ .Values.dspa.objectStorage.endpoint | quote }}
            - name: BUCKET
              value: {{ .Values.dspa.objectStorage.bucket | quote }}
            - name: AWS_DEFAULT_REGION
              value: {{ .Values.dspa.objectStorage.region | quote }}
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.dspa.objectStorage.credentialsSecret }}
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.dspa.objectStorage.credentialsSecret }}
                  key: AWS_SECRET_ACCESS_KEY
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
