{{- with .Values.clusterMonitoringConfig }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-monitoring-config
  namespace: openshift-monitoring
  annotations:
    argocd.argoproj.io/sync-options: ServerSideApply=true,FailOnSharedResource=false
data:
  config.yaml: |
    {{- toYaml . | nindent 4 }}
{{- end }}
---
apiVersion: observability.openshift.io/v1alpha1
kind: UIPlugin
metadata:
  name: monitoring
spec:
  monitoring:
    perses:
      enabled: true
  type: Monitoring
