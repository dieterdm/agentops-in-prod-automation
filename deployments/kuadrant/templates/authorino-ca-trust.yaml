apiVersion: apps/v1
kind: Deployment
metadata:
  name: authorino
  namespace: kuadrant-system
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: ServerSideApply=true,FailOnSharedResource=false,SkipDryRunOnMissingResource=true
spec:
  template:
    spec:
      containers:
      - name: authorino
        env:
        - name: SSL_CERT_FILE
          value: /var/run/secrets/kubernetes.io/serviceaccount/service-ca.crt
        - name: REQUESTS_CA_BUNDLE
          value: /var/run/secrets/kubernetes.io/serviceaccount/service-ca.crt