apiVersion: apps/v1
kind: Deployment
metadata:
  name: authorino
  namespace: kuadrant-system
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: ServerSideApply=true,FailOnSharedResource=false,SkipDryRunOnMissingResource=true
spec:
  template:
    spec:
      containers:
      - name: authorino
        env:
        - name: SSL_CERT_FILE
          value: /etc/ssl/certs/openshift-service-ca/service-ca-bundle.crt
        - name: REQUESTS_CA_BUNDLE
          value: /etc/ssl/certs/openshift-service-ca/service-ca-bundle.crt