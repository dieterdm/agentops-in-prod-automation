# Copy of the RHOAI-managed vllm-cpu-x86-runtime-template with a larger
# /dev/shm. vLLM needs ~160 MiB of shared memory to start its engine, but
# containers only get 64 MiB by default. The dashboard lists serving runtimes
# from Templates in redhat-ods-applications, so this is a Template rather than
# a ClusterServingRuntime.
apiVersion: template.openshift.io/v1
kind: Template
metadata:
  name: vllm-cpu-x86-shm-runtime-template
  namespace: redhat-ods-applications
  annotations:
    description: vLLM is a high-throughput and memory-efficient inference and serving
      engine for LLMs
    opendatahub.io/apiProtocol: REST
    opendatahub.io/model-type: '["generative"]'
    opendatahub.io/modelServingSupport: '["single"]'
    openshift.io/display-name: vLLM CPU (x86) ServingRuntime for KServe (with /dev/shm)
    tags: rhods,rhoai,kserve,servingruntime
  labels:
    app: odh-dashboard
    app.kubernetes.io/part-of: odh-dashboard
    opendatahub.io/dashboard: "true"
objects:
- apiVersion: serving.kserve.io/v1alpha1
  kind: ServingRuntime
  metadata:
    annotations:
      opendatahub.io/runtime-version: v0.24.0
      openshift.io/display-name: vLLM CPU (x86) ServingRuntime for KServe (with /dev/shm)
    labels:
      opendatahub.io/dashboard: "true"
    name: vllm-cpu-x86-shm-runtime
  spec:
    annotations:
      prometheus.io/path: /metrics
      prometheus.io/port: "8080"
    containers:
    - args:
      - --port=8080
      - --model=/mnt/models
      # Escaped so Helm leaves the KServe template variable alone.
      - --served-model-name={{ "{{.Name}}" }}
      command:
      - python
      - -m
      - vllm.entrypoints.openai.api_server
      env:
      - name: HF_HOME
        value: /tmp/hf_home
      image: registry.redhat.io/rhaii-fast/vllm-cpu-rhel9@sha256:c5af8896570f0ed54825cdf933642461ef625a760fb3fd1c8be2ec159225ea56
      name: kserve-container
      ports:
      - containerPort: 8080
        protocol: TCP
      volumeMounts:
      - name: shm
        mountPath: /dev/shm
    volumes:
    # Memory-backed, so it counts against the container's memory limit.
    - name: shm
      emptyDir:
        medium: Memory
        sizeLimit: 1Gi
    multiModel: false
    supportedModelFormats:
    # Dashboard deployments don't set spec.predictor.model.runtime on the
    # InferenceService, so the runtime has to be auto-selectable.
    - autoSelect: true
      name: vLLM
