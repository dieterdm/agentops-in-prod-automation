apiVersion: v1
kind: Secret
metadata:
  name: pgvector-postgresql-credentials-secret
  namespace: ogx
type: Opaque
stringData:
  POSTGRES_DB: database
  POSTGRES_USER: database-user
  POSTGRES_PASSWORD: database-password

---
# Connection details for the OGXServer pgvector provider. Keep these in sync
# with pgvector-postgresql-credentials-secret and the pgvector-postgres Service.
apiVersion: v1
kind: Secret
metadata:
  name: pgvector-connection
  namespace: ogx
type: Opaque
stringData:
  PGVECTOR_HOST: pgvector-postgres
  PGVECTOR_PORT: "5432"
  PGVECTOR_DB: database
  PGVECTOR_USER: database-user
  PGVECTOR_PASSWORD: database-password

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pgvector-postgres-pvc
  namespace: ogx
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgvector-postgres
  namespace: ogx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pgvector-postgres
  template:
    metadata:
      labels:
        app: pgvector-postgres
    spec:
      containers:
      - name: postgres
        image: pgvector/pgvector:pg16
        ports:
        - name: postgres
          containerPort: 5432
        env:
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              name: pgvector-postgresql-credentials-secret
              key: POSTGRES_DB
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: pgvector-postgresql-credentials-secret
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: pgvector-postgresql-credentials-secret
              key: POSTGRES_PASSWORD
        # Keep the data in a subdirectory so initdb doesn't fail on the
        # volume's lost+found directory.
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        volumeMounts:
        - name: pgdata
          mountPath: /var/lib/postgresql/data

        # Replace TCP socket probes with exec probes that validate SQL readiness.
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - pg_isready -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - pg_isready -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"
          initialDelaySeconds: 30
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 6

        # Create the pgvector extension after PostgreSQL is actually accepting SQL.
        lifecycle:
          postStart:
            exec:
              command:
              - /bin/sh
              - -c
              - |
                set -e
                echo "Waiting for PostgreSQL to be ready before enabling pgvector..."
                until PGPASSWORD="$POSTGRES_PASSWORD" psql -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "SELECT 1" >/dev/null 2>&1; do
                  sleep 2
                done
                PGPASSWORD="$POSTGRES_PASSWORD" psql -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "CREATE EXTENSION IF NOT EXISTS vector;"

      volumes:
      - name: pgdata
        persistentVolumeClaim:
          claimName: pgvector-postgres-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: pgvector-postgres
  namespace: ogx
spec:
  selector:
    app: pgvector-postgres
  ports:
  - name: postgres
    port: 5432
    targetPort: 5432
  type: ClusterIP