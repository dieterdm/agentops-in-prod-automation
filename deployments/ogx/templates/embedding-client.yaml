# Identity the OGXServer uses to call the embedding model. With
# security.opendatahub.io/enable-auth, the model's kube-rbac-proxy only lets
# through tokens that may get the InferenceService.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ogx-embedding-client
  namespace: ogx

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ogx-embedding-client
  namespace: ogx
rules:
- apiGroups: ["serving.kserve.io"]
  resources: ["inferenceservices"]
  resourceNames: ["redhataimultilingual-e5-large"]
  verbs: ["get"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ogx-embedding-client
  namespace: ogx
subjects:
- kind: ServiceAccount
  name: ogx-embedding-client
  namespace: ogx
roleRef:
  kind: Role
  name: ogx-embedding-client
  apiGroup: rbac.authorization.k8s.io

---
# Long-lived token for ogx-embedding-client, filled in by Kubernetes. Generated
# in the cluster, so it never has to go through values.secret.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: ogx-embedding-client-token
  namespace: ogx
  annotations:
    kubernetes.io/service-account.name: ogx-embedding-client
type: kubernetes.io/service-account-token
